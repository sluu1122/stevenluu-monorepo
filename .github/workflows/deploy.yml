name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Separate from `verify` so the fast unit suite still reports in seconds:
  # this job pays for a browser download and a production build.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/finance/react-dashboard

      # The turbo task depends on `build`, so this produces the production
      # bundle the spec needs - the dev server would not reproduce the
      # production-only regression it guards.
      - run: npx turbo run test:e2e --filter=react-dashboard

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/finance/react-dashboard/playwright-report/
          retention-days: 7

  build-and-push:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portfolio
            dockerfile: apps/portfolio/Dockerfile
            build-args: |
              NEXT_PUBLIC_HEALTHCARE_SANDBOX_URL=https://healthcare.stevenluu.com
              NEXT_PUBLIC_FINANCE_SANDBOX_URL=https://finance.stevenluu.com
          - name: react-dashboard
            dockerfile: apps/finance/react-dashboard/Dockerfile
          - name: angular-dashboard
            dockerfile: apps/healthcare/angular-dashboard/Dockerfile
          - name: ai-api
            dockerfile: apps/healthcare/ai-api/Dockerfile
          - name: cpt-api
            dockerfile: apps/healthcare/cpt-api/Dockerfile
          - name: icd-api
            dockerfile: apps/healthcare/icd-api/Dockerfile
          - name: patients-api
            dockerfile: apps/healthcare/patients-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args || '' }}
          tags: |
            ghcr.io/sluu1122/${{ matrix.name }}:latest
            ghcr.io/sluu1122/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
